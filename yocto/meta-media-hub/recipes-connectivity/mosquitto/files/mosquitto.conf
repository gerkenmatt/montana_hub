# Listen on all interfaces (WireGuard + Local)
listener 1883
allow_anonymous true

# Persistence
persistence true
persistence_location /var/lib/mosquitto/
log_dest file /var/log/mosquitto/mosquitto.log

# --- BRIDGE TO CLOUD ---
connection montanacloud
address montanaiothub.cloud:8883
bridge_cafile /etc/ssl/certs/ca-certificates.crt
remote_username montana_pi_bridge
remote_password YOUR_REAL_PASSWORD_HERE

# Sync everything starting with cabin/
topic cabin/# both 0 "" ""