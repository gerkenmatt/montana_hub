# We have a conf and classes directory, add to BBPATH
BBPATH .= ":${LAYERDIR}"

# We have recipes-* directories, add to BBFILES
BBFILES += "${LAYERDIR}/recipes-*/*/*.bb \
            ${LAYERDIR}/recipes-*/*/*.bbappend"

BBFILE_COLLECTIONS += "meta-private-secrets"
BBFILE_PATTERN_meta-private-secrets = "^${LAYERDIR}/"
BBFILE_PRIORITY_meta-private-secrets = "6"

LAYERDEPENDS_meta-private-secrets = "core"
LAYERSERIES_COMPAT_meta-private-secrets = "scarthgap"
