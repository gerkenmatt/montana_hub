<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cabin Security Hub</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: #121212;
            color: #e0e0e0;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px;
        }
        h1 { color: white; margin-bottom: 30px; }
        
        .dashboard {
            display: flex;
            flex-wrap: wrap;
            gap: 40px;
            justify-content: center;
        }
        
        .camera-card {
            display: flex;
            flex-direction: column;
            gap: 10px;
            width: 640px;
        }

        .video-container {
            border: 1px solid #444;
            background-color: #000;
            height: 480px;
        }
        img {
            width: 100%;
            height: 100%;
            object-fit: contain;
        }
        
        .status-box {
            padding: 20px 0;
            font-size: 1.8em;
            font-weight: bold;
            text-align: center;
            border-radius: 8px;
            text-transform: uppercase;
            color: white;
            transition: background-color 0.3s ease;
            min-height: 60px;
            display: flex;
            flex-direction: column;
            justify-content: center;
        }
        .status-box.clear { background-color: #28a745; }
        .status-box.detected { background-color: #dc3545; }
        
        .status-box .confidence {
            font-size: 0.6em;
            font-weight: normal;
            margin-top: 5px;
        }

        /* Controls Section */
        .controls {
            margin-top: 30px;
            padding: 20px;
            background-color: #1e1e1e;
            border-radius: 10px;
            display: inline-flex;
            gap: 30px;
            align-items: center;
            border: 1px solid #333;
        }
        .control-group {
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .control-group span {
            font-weight: bold;
            color: #aaa;
        }
        .switch { position: relative; display: inline-block; width: 50px; height: 28px; }
        .switch input { opacity: 0; width: 0; height: 0; }
        .slider { position: absolute; cursor: pointer; top: 0; left: 0; right: 0; bottom: 0; background-color: #ccc; border-radius: 34px; transition: .4s; }
        .slider:before { position: absolute; content: ""; height: 20px; width: 20px; left: 4px; bottom: 4px; background-color: white; border-radius: 50%; transition: .4s; }
        input:checked + .slider { background-color: #2196F3; }
        input:checked + .slider:before { transform: translateX(22px); }

        /* History Grid */
        .history-section { margin: 40px auto; width: 90%; max-width: 1300px; }
        .history-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 20px; margin-top: 20px; }
        .event-card { background: #222; border: 1px solid #444; border-radius: 8px; overflow: hidden; display: flex; flex-direction: column; }
        .event-header { padding: 10px; background: #333; display: flex; justify-content: space-between; align-items: center; }
        .event-badge { background: #dc3545; color: white; padding: 4px 8px; border-radius: 4px; font-size: 0.8em; font-weight: bold; }
        .event-video video { width: 100%; height: auto; display: block; }
        .event-footer { padding: 10px; font-size: 0.9em; color: #aaa; display: flex; justify-content: space-between; }
        
        .event-actions { display: flex; border-top: 1px solid #333; }
        .action-btn { flex: 1; background: none; border: none; padding: 10px; color: #aaa; cursor: pointer; font-size: 1.2em; transition: 0.2s; text-decoration: none; display: flex; justify-content: center; align-items: center; }
        .action-btn:hover { background-color: #333; color: white; }
        .btn-download:hover { color: #2196F3; }
        .btn-delete:hover { color: #dc3545; }
    </style>
</head>
<body>
    <h1>Cabin Security Hub</h1>
    
    <div class="dashboard">
        <div class="camera-card">
            <h2>Camera 1 (Front Door)</h2>
            <div class="video-container">
                <img src="/video_feed_1" alt="Camera 1 Feed">
            </div>
            <div id="status-camera1" class="status-box clear">
                Connecting...
            </div>
        </div>

        <div class="camera-card">
            <h2>Camera 2 (Driveway)</h2>
            <div class="video-container">
                <img src="/video_feed_2" alt="Camera 2 Feed">
            </div>
            <div id="status-camera2" class="status-box clear">
                Connecting...
            </div>
        </div>
    </div>

    <div class="controls">
        <div class="control-group">
            <span>Email Notifications</span>
            <label class="switch">
                <input type="checkbox" id="email-toggle">
                <span class="slider"></span>
            </label>
        </div>

        <div class="control-group" style="border-left: 1px solid #444; padding-left: 20px;">
            <span>Cloud Upload</span>
            <label class="switch">
                <input type="checkbox" id="upload-toggle" checked>
                <span class="slider"></span>
            </label>
        </div>
    </div>

    <div class="history-section">
        <h2>🚨 Event History (Cloud Storage)</h2>
        <div id="history-container" class="history-grid"></div>
    </div>

    <script>
        // --- Function to delete an event ---
        function deleteEvent(cameraId, timestamp, cardElement) {
            if(!confirm("Are you sure you want to delete this clip? This cannot be undone.")) return;

            fetch(`http://10.0.0.1:8080/api/delete/${cameraId}/${timestamp}`, {
                method: 'DELETE'
            })
            .then(response => response.json())
            .then(data => {
                if (data.status === "success") {
                    cardElement.remove();
                } else {
                    alert("Error deleting clip: " + data.message);
                }
            })
            .catch(err => alert("Network error: " + err));
        }

        // --- Function to create the HTML card for an event ---
        function createEventCard(event) {
            const div = document.createElement('div');
            div.className = 'event-card';
            
            // Format confidence safely
            const conf = event.confidence ? (event.confidence * 100).toFixed(0) : "??";

            div.innerHTML = `
                <div class="event-header">
                    <strong>${event.camera_id}</strong>
                    <span class="event-badge">${conf}%</span>
                </div>
                <div class="event-video">
                    <video controls preload="metadata">
                        <source src="${event.video_url}" type="video/mp4">
                        Your browser does not support video.
                    </video>
                </div>
                <div class="event-footer">
                    ${event.date_string}
                </div>
                <div class="event-actions">
                    <a href="${event.video_url}" download class="action-btn btn-download" title="Download">
                        ⬇️
                    </a>
                    <button class="action-btn btn-delete" title="Delete" 
                        onclick="deleteEvent('${event.camera_id}', ${event.timestamp}, this.closest('.event-card'))">
                        🗑️
                    </button>
                </div>
            `;
            return div;
        }

        // --- Function to load history from VPS ---
        function loadHistory() {
            fetch('http://10.0.0.1:8080/api/history')
                .then(res => res.json())
                .then(data => {
                    const container = document.getElementById('history-container');
                    container.innerHTML = ''; 
                    data.forEach(e => container.appendChild(createEventCard(e)));
                })
                .catch(err => console.error("Failed to load history:", err));
        }

        // --- Main Execution ---
        document.addEventListener("DOMContentLoaded", function() {
            
            // 1. Load History
            loadHistory();

            // 2. Connect WebSocket
            const ws = new WebSocket("ws://" + location.host + "/ws");

            ws.onmessage = (e) => {
                const data = JSON.parse(e.data);
                
                // Handle Live Status Update
                const el = document.getElementById(`status-${data.camera_id}`);
                if(el) {
                    if(data.event === "person_detected") {
                        let confidence = data.confidence || 0;
                        el.className = "status-box detected";
                        el.innerText = `HUMAN DETECTED (${(confidence*100).toFixed(0)}%)`;
                    } else if(data.event === "clear") {
                        el.className = "status-box clear";
                        el.innerText = "STATUS: CLEAR";
                    }
                }
                
                // Refresh history if a new clip is uploaded (Optional logic you can add later)
            };

            ws.onclose = () => {
                console.log("WebSocket disconnected.");
                document.querySelectorAll('.status-box').forEach(el => {
                    el.className = "status-box detected";
                    el.innerText = "Connection Lost";
                });
            };

            // 3. Setup Toggles
            const emailToggle = document.getElementById('email-toggle');
            if (emailToggle) {
                emailToggle.addEventListener('change', function() {
                    fetch('/api/settings/email', {
                        method: 'POST',
                        headers: {'Content-Type': 'application/json'},
                        body: JSON.stringify({enabled: this.checked})
                    });
                });
            }

            const uploadToggle = document.getElementById('upload-toggle');
            if (uploadToggle) {
                uploadToggle.addEventListener('change', function() {
                    fetch('/api/settings/upload', {
                        method: 'POST',
                        headers: {'Content-Type': 'application/json'},
                        body: JSON.stringify({enabled: this.checked})
                    });
                });
            }
        });
    </script>
</body>
</html>
