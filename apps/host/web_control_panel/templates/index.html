<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cabin Security Hub</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: #121212;
            color: #e0e0e0;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px;
            padding-bottom: 80px; /* Space for bottom button */
        }
        h1 { color: white; margin-bottom: 30px; }
        
        /* Telemetry Bar */
        .stats-container {
            display: flex; gap: 30px; background: #222; padding: 15px 40px; border-radius: 50px;
            margin-bottom: 30px; border: 1px solid #444; justify-content: center;
            width: fit-content; margin-left: auto; margin-right: auto;
        }
        .stat-item { font-weight: bold; color: #888; font-size: 1rem; }
        .stat-value { color: #fff; font-size: 1.2rem; margin-left: 5px; }
        .stat-value.alert { color: #dc3545; }

        .dashboard { display: flex; flex-wrap: wrap; justify-content: center; gap: 20px; padding: 20px; }
        .camera-card { width: 640px; display: flex; flex-direction: column; gap: 10px; }
        .video-container { border: 1px solid #444; background: #000; height: 480px; position: relative; }
        img { width: 100%; height: 100%; object-fit: contain; }
        
        /* Status Box */
        .status-box { padding: 15px; font-size: 1.5em; font-weight: bold; border-radius: 8px; text-align: center; text-transform: uppercase; color: white;}
        .clear { background-color: #28a745; }
        .detected { background-color: #dc3545; }

        /* Quality Toggle Buttons */
        .quality-controls {
            display: flex; justify-content: center; gap: 0; background: #333; border-radius: 20px;
            width: fit-content; margin: 0 auto; overflow: hidden; border: 1px solid #555;
        }
        .q-btn { background: none; border: none; color: #aaa; padding: 8px 20px; cursor: pointer; font-weight: bold; transition: 0.2s; }
        .q-btn.active { background-color: #2196F3; color: white; }
        
        /* Controls */
        .controls { 
            margin-top: 30px; padding: 20px; background: #1e1e1e; border-radius: 10px; 
            display: inline-flex; gap: 30px; align-items: center; border: 1px solid #333;
        }
        .control-group { display: flex; align-items: center; gap: 10px; }
        .control-group span { font-weight: bold; color: #aaa; }
        .switch { position: relative; display: inline-block; width: 50px; height: 28px; }
        .switch input { opacity: 0; width: 0; height: 0; }
        .slider { position: absolute; cursor: pointer; top: 0; left: 0; right: 0; bottom: 0; background-color: #ccc; border-radius: 34px; transition: .4s; }
        .slider:before { position: absolute; content: ""; height: 20px; width: 20px; left: 4px; bottom: 4px; background-color: white; border-radius: 50%; transition: .4s; }
        input:checked + .slider { background-color: #2196F3; }
        input:checked + .slider:before { transform: translateX(22px); }
        
        /* History Grid */
        .history-section { margin: 40px auto; width: 90%; max-width: 1300px; }
        .filter-bar { display: flex; justify-content: center; gap: 15px; margin-bottom: 20px; background: #1e1e1e; padding: 15px; border-radius: 10px; border: 1px solid #333; }
        .filter-btn { background-color: #333; border: 1px solid #555; color: white; padding: 8px 16px; border-radius: 5px; cursor: pointer; font-weight: bold; }
        .filter-btn:hover { background-color: #444; }
        .filter-btn.active { background-color: #2196F3; border-color: #2196F3; }
        input[type="date"] { background-color: #333; border: 1px solid #555; color: white; padding: 8px; border-radius: 5px; color-scheme: dark; }

        .history-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 15px; margin-top: 20px; }
        .event-card { background: #222; border: 1px solid #444; border-radius: 8px; overflow: hidden; display: flex; flex-direction: column; }
        .event-header { padding: 10px; background: #333; display: flex; justify-content: space-between; align-items: center; }
        .event-badge { background: #dc3545; color: white; padding: 4px 8px; border-radius: 4px; font-size: 0.8em; font-weight: bold; }
        .event-video video { width: 100%; height: auto; display: block; }
        .event-footer { padding: 10px; font-size: 0.9em; color: #aaa; display: flex; justify-content: space-between; }
        
        .event-actions { display: flex; border-top: 1px solid #333; }
        .action-btn { flex: 1; background: none; border: none; padding: 10px; color: #aaa; cursor: pointer; font-size: 1.2em; transition: 0.2s; text-decoration: none; display: flex; justify-content: center; align-items: center; }
        .action-btn:hover { background-color: #333; color: white; }
        .btn-download:hover { color: #2196F3; }
        .btn-delete:hover { color: #dc3545; }

        .danger-zone { margin-top: 40px; }
        .btn-reboot { background-color: #3a1c1c; color: #ff6b6b; border: 1px solid #dc3545; padding: 10px 25px; border-radius: 8px; cursor: pointer; font-weight: bold; transition: 0.2s; }
        .btn-reboot:hover { background-color: #dc3545; color: white; }
        /* New Mode Control Bar */
        .mode-controls {
            display: flex; 
            justify-content: center; 
            gap: 5px; 
            margin-top: 10px;
            background: #222;
            padding: 5px;
            border-radius: 10px;
        }
        .mode-btn {
            flex: 1;
            background: #333;
            border: 1px solid #444;
            color: #aaa;
            padding: 8px 0;
            cursor: pointer;
            font-size: 0.8rem;
            font-weight: bold;
            border-radius: 5px;
            transition: 0.2s;
        }
        .mode-btn:hover { background: #444; color: white; }
        
        /* Active States */
        .mode-btn.active-off { background-color: #dc3545; color: white; border-color: #dc3545; }
        .mode-btn.active-sentry { background-color: #ffbb33; color: black; border-color: #ffbb33; }
        .mode-btn.active-live { background-color: #00C851; color: white; border-color: #00C851; }
    </style>
</head>
<body>
    <h1>Cabin Security Hub</h1>
    
    <div class="stats-container">
        <div class="stat-item">CPU: <span id="stat-cpu" class="stat-value">--</span>%</div>
        <div class="stat-item">RAM: <span id="stat-ram" class="stat-value">--</span>%</div>
        <div class="stat-item">TEMP: <span id="stat-temp" class="stat-value">--</span>°F</div>
        <div class="stat-item">DISK: <span id="stat-disk" class="stat-value">--</span>%</div>
        <div class="stat-item">DATA: <span id="stat-net" class="stat-value">--</span> MB <span style="font-size:0.8em; color:#888;">(<span id="stat-rate">--</span> MB/m)</span></div>
    </div>

    <div class="dashboard">
        <div class="camera-card">
            <h3>Front Door</h3>
            <div class="video-container">
                <img id="vid-cam1" src="/feed/cam1/sd" data-quality="sd">
            </div>
            
            <div class="quality-controls">
                <button class="q-btn active" onclick="setQuality(1, 'sd', this)">SD</button>
                <button class="q-btn" onclick="setQuality(1, 'hd', this)">HD</button>
            </div>

            <div class="mode-controls" id="ctrl-cam1">
                <button class="mode-btn active-off" onclick="setStreamMode('cam1', 'OFF', this)">OFF</button>
                <button class="mode-btn" onclick="setStreamMode('cam1', 'LOW', this)">SENTRY</button>
                <button class="mode-btn" onclick="setStreamMode('cam1', 'MEDIUM', this)">1 FPS</button>
                <button class="mode-btn" onclick="setStreamMode('cam1', 'HIGH', this)">LIVE</button>
            </div>

            <div id="status-camera1" class="status-box clear">Connecting...</div>
        </div>

        <div class="camera-card">
            <h3>Driveway</h3>
            <div class="video-container">
                <img id="vid-cam2" src="/feed/cam2/sd" data-quality="sd">
            </div>

            <div class="quality-controls">
                <button class="q-btn active" onclick="setQuality(2, 'sd', this)">SD</button>
                <button class="q-btn" onclick="setQuality(2, 'hd', this)">HD</button>
            </div>

            <div class="mode-controls" id="ctrl-cam2">
                <button class="mode-btn active-off" onclick="setStreamMode('cam2', 'OFF', this)">OFF</button>
                <button class="mode-btn" onclick="setStreamMode('cam2', 'LOW', this)">SENTRY</button>
                <button class="mode-btn" onclick="setStreamMode('cam2', 'MEDIUM', this)">1 FPS</button>
                <button class="mode-btn" onclick="setStreamMode('cam2', 'HIGH', this)">LIVE</button>
            </div>

            <div id="status-camera2" class="status-box clear">Connecting...</div>
        </div>

    <div class="controls">
        <div class="control-group">
            <span>Email</span>
            <label class="switch"><input type="checkbox" id="email-toggle"><span class="slider"></span></label>
        </div>
        <div style="border-left:1px solid #444; height:30px;"></div>
        <div class="control-group">
            <span>Upload</span>
            <label class="switch"><input type="checkbox" id="upload-toggle" checked><span class="slider"></span></label>
        </div>
    </div>

    <div class="history-section">
        <h2>Event History</h2>
        
        <div class="filter-bar">
            <button class="filter-btn active" id="btn-all" onclick="filterHistory('all')">ALL</button>
            <button class="filter-btn" id="btn-today" onclick="filterHistory('today')">Today</button>
            <button class="filter-btn" id="btn-yesterday" onclick="filterHistory('yesterday')">Yesterday</button>
            <input type="date" id="date-picker" onchange="filterHistory('custom')">
        </div>

        <div id="history-container" class="history-grid"></div>
    </div>
    
    <div class="danger-zone">
        <button class="btn-reboot" onclick="rebootSystem()">⚠️ REBOOT REMOTE PI</button>
    </div>

    <script>
        // --- Date Helpers ---
        function formatDate(date) { return date.toISOString().split('T')[0]; }

        function filterHistory(mode) {
            let url = 'http://10.0.0.1:8080/api/history';
            document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
            
            if (mode === 'today') {
                url += `?date=${formatDate(new Date())}`;
                document.getElementById('btn-today').classList.add('active');
            } else if (mode === 'yesterday') {
                const d = new Date(); d.setDate(d.getDate() - 1);
                url += `?date=${formatDate(d)}`;
                document.getElementById('btn-yesterday').classList.add('active');
            } else if (mode === 'custom') {
                const val = document.getElementById('date-picker').value;
                if(val) url += `?date=${val}`;
            } else {
                document.getElementById('btn-all').classList.add('active');
            }
            loadHistory(url);
        }

        // --- Core Functions ---
        function setQuality(camId, quality, btnElement) {
            const img = document.getElementById(`vid-cam${camId}`);
            img.src = `/feed/cam${camId}/${quality}?t=${new Date().getTime()}`;
            img.setAttribute('data-quality', quality); // <--- Store current quality
            
            btnElement.parentElement.querySelectorAll('.q-btn').forEach(btn => btn.classList.remove('active'));
            btnElement.classList.add('active');
        }

        function setStreamMode(camId, mode, btnElement) {
            // 1. Get current quality (sd or hd) so we turn on the right service
            const quality = document.getElementById(`vid-${camId}`).getAttribute('data-quality');            
            
            // 2. Visual Feedback
            const container = document.getElementById(`ctrl-${camId}`);
            container.querySelectorAll('.mode-btn').forEach(b => b.className = 'mode-btn'); // Reset all
            
            // Set active class based on mode
            if(mode === 'OFF') btnElement.classList.add('active-off');
            else if(mode === 'LOW') btnElement.classList.add('active-sentry');
            else btnElement.classList.add('active-live');

            // 3. Send API Request
            console.log(`Setting ${camId} (${quality}) to ${mode}`);
            fetch('/api/camera/control', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ 
                    camera_id: camId, 
                    stream_type: quality, 
                    mode: mode 
                })
            })
            .then(r => r.json())
            .then(data => console.log("Result:", data))
            .catch(err => console.error("Error:", err));
        }

        function deleteEvent(cameraId, timestamp, cardElement) {
            if(!confirm("Delete clip?")) return;
            fetch(`http://10.0.0.1:8080/api/delete/${cameraId}/${timestamp}`, { method: 'DELETE' })
            .then(r => r.json()).then(d => { if(d.status==="success") cardElement.remove(); });
        }

        function rebootSystem() {
            if(!confirm("Are you sure you want to REBOOT the remote Pi?")) return;
            fetch('/api/system/reboot', { method: 'POST' })
            .then(r => alert("Reboot command sent. System will restart."));
        }

        function createEventCard(event) {
            const div = document.createElement('div');
            div.className = 'event-card';
            const conf = event.confidence ? (event.confidence * 100).toFixed(0) : "??";
            div.innerHTML = `
                <div class="event-header"><strong>${event.camera_id}</strong><span class="event-badge">${conf}%</span></div>
                <div class="event-video"><video controls preload="metadata"><source src="${event.video_url}" type="video/mp4"></video></div>
                <div class="event-footer">${event.date_string}</div>
                <div class="event-actions">
                    <a href="${event.video_url}" download class="action-btn btn-download">⬇️</a>
                    <button class="action-btn btn-delete" onclick="deleteEvent('${event.camera_id}', ${event.timestamp}, this.closest('.event-card'))">🗑️</button>
                </div>`;
            return div;
        }

        function loadHistory(url) {
            if (!url) url = 'http://10.0.0.1:8080/api/history';
            const c = document.getElementById('history-container');
            c.innerHTML = '<p style="color:#aaa">Loading...</p>';
            
            fetch(url).then(r => r.json())
            .then(d => {
                c.innerHTML='';
                if(d.length===0) c.innerHTML='<p style="color:#aaa">No events found.</p>';
                d.forEach(e => c.appendChild(createEventCard(e)));
            })
            .catch(e => { console.error(e); c.innerHTML='<p style="color:red">Failed to load history.</p>'; });
        }

        // --- Main Load ---
        document.addEventListener("DOMContentLoaded", function() {
            filterHistory('all');
            
            const ws = new WebSocket("ws://" + location.host + "/ws");
            ws.onmessage = (e) => {
                const data = JSON.parse(e.data);
                
                // 1. Handle Telemetry
                if (data.type === 'telemetry' && data.telemetry) {
                    document.getElementById('stat-cpu').innerText = data.telemetry.cpu;
                    document.getElementById('stat-ram').innerText = data.telemetry.ram;
                    document.getElementById('stat-disk').innerText = data.telemetry.disk;
                    
                    const temp = data.telemetry.temp;
                    const tempEl = document.getElementById('stat-temp');
                    tempEl.innerText = temp;
                    if(temp > 175) tempEl.className = "stat-value alert"; else tempEl.className = "stat-value";

                    if (data.telemetry.net_sent) document.getElementById('stat-net').innerText = data.telemetry.net_sent;
                    if (data.telemetry.net_rate !== undefined) document.getElementById('stat-rate').innerText = data.telemetry.net_rate;
                }

                // 2. Handle Detection
                if (data.type === 'detection') {
                    const el = document.getElementById(`status-${data.camera_id}`);
                    if(el) {
                        if(data.event === "person_detected") {
                            el.className = "status-box detected";
                            el.innerText = `HUMAN DETECTED (${(data.confidence*100).toFixed(0)}%)`;
                        } else if(data.event === "clear") {
                            el.className = "status-box clear"; el.innerText = "STATUS: CLEAR";
                        }
                    }
                }
            };

            const emailT = document.getElementById('email-toggle');
            if(emailT) emailT.addEventListener('change', function() {
                fetch('/api/settings/email', {method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify({enabled:this.checked})});
            });
            const uploadT = document.getElementById('upload-toggle');
            if(uploadT) uploadT.addEventListener('change', function() {
                fetch('/api/settings/upload', {method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify({enabled:this.checked})});
            });
        });
    </script>
</body>
</html>
