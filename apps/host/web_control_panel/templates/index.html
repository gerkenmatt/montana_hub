<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cabin Security Hub</title>
    <style>
        body { font-family: sans-serif; background-color: #121212; color: #e0e0e0; text-align: center; padding-bottom: 50px; }
        
        /* Telemetry Bar */
        .stats-container {
            display: flex;
            gap: 30px;
            background: #222;
            padding: 15px 40px;
            border-radius: 50px;
            margin-bottom: 30px;
            border: 1px solid #444;
            justify-content: center;
            width: fit-content;
            margin-left: auto;
            margin-right: auto;
        }
        .stat-item { font-weight: bold; color: #888; font-size: 1rem; }
        .stat-value { color: #fff; font-size: 1.2rem; margin-left: 5px; }
        .stat-value.alert { color: #dc3545; }

        .dashboard { display: flex; flex-wrap: wrap; justify-content: center; gap: 20px; padding: 20px; }
        .camera-card { width: 640px; display: flex; flex-direction: column; gap: 10px; }
        .video-container { border: 1px solid #444; background: #000; height: 480px; position: relative; }
        img { width: 100%; height: 100%; object-fit: contain; }
        
        .status-box { padding: 15px; font-size: 1.5em; font-weight: bold; border-radius: 8px; }
        .clear { background-color: #28a745; }
        .detected { background-color: #dc3545; }

        .quality-controls {
            display: flex; justify-content: center; gap: 0; background: #333; border-radius: 20px;
            width: fit-content; margin: 0 auto; overflow: hidden; border: 1px solid #555;
        }
        .q-btn { background: none; border: none; color: #aaa; padding: 8px 20px; cursor: pointer; font-weight: bold; transition: 0.2s; }
        .q-btn.active { background-color: #2196F3; color: white; }
        
        .controls { margin-top: 30px; padding: 20px; background: #1e1e1e; display: inline-flex; gap: 30px; border-radius: 10px; align-items: center; border: 1px solid #333;}
        .switch { position: relative; display: inline-block; width: 50px; height: 28px; }
        .switch input { opacity: 0; width: 0; height: 0; }
        .slider { position: absolute; cursor: pointer; top: 0; left: 0; right: 0; bottom: 0; background-color: #ccc; border-radius: 34px; transition: .4s; }
        .slider:before { position: absolute; content: ""; height: 20px; width: 20px; left: 4px; bottom: 4px; background-color: white; border-radius: 50%; transition: .4s; }
        input:checked + .slider { background-color: #2196F3; }
        input:checked + .slider:before { transform: translateX(22px); }
        
        .history-section { margin: 40px auto; width: 90%; max-width: 1300px; }
        .history-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 15px; }
        .event-card { background: #222; border: 1px solid #444; border-radius: 8px; overflow: hidden; }
        .event-header { padding: 8px; background: #333; display: flex; justify-content: space-between; }
        .event-badge { background: #dc3545; padding: 2px 6px; border-radius: 4px; font-size: 0.8em; }
        .event-video video { width: 100%; display: block; }
        .event-footer { padding: 8px; font-size: 0.85em; color: #aaa; text-align: right; }
        
        .event-actions { display: flex; border-top: 1px solid #333; }
        .action-btn { flex: 1; background: none; border: none; padding: 10px; color: #aaa; cursor: pointer; font-size: 1.2em; transition: 0.2s; text-decoration: none; display: flex; justify-content: center; align-items: center; }
        .action-btn:hover { background-color: #333; color: white; }
        .btn-download:hover { color: #2196F3; }
        .btn-delete:hover { color: #dc3545; }

        /* Reboot Button */
        .danger-zone { margin-top: 40px; }
        .btn-reboot { background-color: #3a1c1c; color: #ff6b6b; border: 1px solid #dc3545; padding: 10px 25px; border-radius: 8px; cursor: pointer; font-weight: bold; transition: 0.2s; }
        .btn-reboot:hover { background-color: #dc3545; color: white; }
    </style>
</head>
<body>
    <h1>Cabin Security Hub</h1>
    
    <div class="stats-container">
        <div class="stat-item">CPU: <span id="stat-cpu" class="stat-value">--</span>%</div>
        <div class="stat-item">RAM: <span id="stat-ram" class="stat-value">--</span>%</div>
        <div class="stat-item">TEMP: <span id="stat-temp" class="stat-value">--</span>°C</div>
        <div class="stat-item">DISK: <span id="stat-disk" class="stat-value">--</span>%</div>
    </div>

    <div class="dashboard">
        <div class="camera-card">
            <h3>Front Door</h3>
            <div class="video-container"><img id="vid-cam1" src="/feed/cam1/sd"></div>
            <div class="quality-controls">
                <button class="q-btn active" onclick="setQuality(1, 'sd', this)">SD</button>
                <button class="q-btn" onclick="setQuality(1, 'hd', this)">HD</button>
            </div>
            <div id="status-camera1" class="status-box clear">Connecting...</div>
        </div>
        <div class="camera-card">
            <h3>Driveway</h3>
            <div class="video-container"><img id="vid-cam2" src="/feed/cam2/sd"></div>
            <div class="quality-controls">
                <button class="q-btn active" onclick="setQuality(2, 'sd', this)">SD</button>
                <button class="q-btn" onclick="setQuality(2, 'hd', this)">HD</button>
            </div>
            <div id="status-camera2" class="status-box clear">Connecting...</div>
        </div>
    </div>

    <div class="controls">
        <div style="display:flex; align-items:center; gap:10px;">
            <span>Email</span>
            <label class="switch"><input type="checkbox" id="email-toggle"><span class="slider"></span></label>
        </div>
        <div style="border-left:1px solid #444; height:30px;"></div>
        <div style="display:flex; align-items:center; gap:10px;">
            <span>Upload</span>
            <label class="switch"><input type="checkbox" id="upload-toggle" checked><span class="slider"></span></label>
        </div>
    </div>

    <div class="history-section">
        <h2>🚨 Event History</h2>
        <div id="history-container" class="history-grid"></div>
    </div>
    
    <div class="danger-zone">
        <button class="btn-reboot" onclick="rebootSystem()">⚠️ REBOOT REMOTE PI</button>
    </div>

    <script>
        function setQuality(camId, quality, btnElement) {
            const img = document.getElementById(`vid-cam${camId}`);
            img.src = `/feed/cam${camId}/${quality}?t=${new Date().getTime()}`;
            btnElement.parentElement.querySelectorAll('.q-btn').forEach(btn => btn.classList.remove('active'));
            btnElement.classList.add('active');
        }

        function deleteEvent(cameraId, timestamp, cardElement) {
            if(!confirm("Delete clip?")) return;
            fetch(`http://10.0.0.1:8080/api/delete/${cameraId}/${timestamp}`, { method: 'DELETE' })
            .then(r => r.json()).then(d => { if(d.status==="success") cardElement.remove(); });
        }

        function rebootSystem() {
            if(!confirm("Are you sure you want to REBOOT the remote Pi?")) return;
            fetch('/api/system/reboot', { method: 'POST' })
            .then(r => alert("Reboot command sent. System will restart."));
        }

        function createEventCard(event) {
            const div = document.createElement('div');
            div.className = 'event-card';
            const conf = event.confidence ? (event.confidence * 100).toFixed(0) : "??";
            div.innerHTML = `
                <div class="event-header"><strong>${event.camera_id}</strong><span class="event-badge">${conf}%</span></div>
                <div class="event-video"><video controls preload="none"><source src="${event.video_url}" type="video/mp4"></video></div>
                <div class="event-footer">${event.date_string}</div>
                <div class="event-actions">
                    <a href="${event.video_url}" download class="action-btn btn-download">⬇️</a>
                    <button class="action-btn btn-delete" onclick="deleteEvent('${event.camera_id}', ${event.timestamp}, this.closest('.event-card'))">🗑️</button>
                </div>`;
            return div;
        }

        function loadHistory() {
            fetch('http://10.0.0.1:8080/api/history').then(r => r.json())
            .then(d => {
                const c = document.getElementById('history-container'); c.innerHTML='';
                d.forEach(e => c.appendChild(createEventCard(e)));
            })
            .catch(err => console.error("History error:", err));
        }

        document.addEventListener("DOMContentLoaded", function() {
            loadHistory();
            const ws = new WebSocket("ws://" + location.host + "/ws");
            
            ws.onmessage = (e) => {
                const data = JSON.parse(e.data);
                
                // 1. Handle Telemetry
                if (data.type === 'telemetry' && data.telemetry) {
                    document.getElementById('stat-cpu').innerText = data.telemetry.cpu;
                    document.getElementById('stat-ram').innerText = data.telemetry.ram;
                    document.getElementById('stat-disk').innerText = data.telemetry.disk;
                    
                    const temp = data.telemetry.temp;
                    const tempEl = document.getElementById('stat-temp');
                    tempEl.innerText = temp;
                    if(temp > 75) tempEl.className = "stat-value alert";
                    else tempEl.className = "stat-value";
                }

                // 2. Handle Detection
                if (data.type === 'detection') {
                    const el = document.getElementById(`status-${data.camera_id}`);
                    if(el) {
                        if(data.event === "person_detected") {
                            el.className = "status-box detected";
                            el.innerText = `HUMAN DETECTED (${(data.confidence*100).toFixed(0)}%)`;
                        } else if(data.event === "clear") {
                            el.className = "status-box clear"; el.innerText = "STATUS: CLEAR";
                        }
                    }
                }
            };

            const emailT = document.getElementById('email-toggle');
            if(emailT) emailT.addEventListener('change', function() {
                fetch('/api/settings/email', {method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify({enabled:this.checked})});
            });
            const uploadT = document.getElementById('upload-toggle');
            if(uploadT) uploadT.addEventListener('change', function() {
                fetch('/api/settings/upload', {method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify({enabled:this.checked})});
            });
        });
    </script>
</body>
</html>
